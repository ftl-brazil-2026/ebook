[project]
name = "spacetech-gis-ebook"
version = "0.1.0"
description = "SpaceTech Bootcamp — GIS module course ebook and notebooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cartopy>=0.25.0",
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geobr>=1.0.0",
    "geodatasets>=2026.5.1",
    "geopandas>=1.0.0,<=1.1.2",
    "geopy>=2.5.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[tool.uv]
package = false
