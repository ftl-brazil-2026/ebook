<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="temas_provedores_bubble.css">
</head>
<body>
<div class="geo-wrap">
  <div class="geo-header">
    <h2 class="geo-eyebrow">Ecossistema Geoespacial</h2>
    <p class="geo-subtitle">Use o <strong>scroll ou clique</strong> nos temas para focar e revelar os provedores.</p>
  </div>
  
  <div class="geo-bar">
    <span class="geo-key"><i class="geo-dot br"></i>Nacional (BR)</span>
    <span class="geo-key"><i class="geo-dot gl"></i>Global</span>
  </div>
  
  <div class="geo-chart-container">
    <svg class="geo-svg" id="geoSvg" role="img"></svg>
    <div id="tooltip" class="geo-tooltip"></div>
  </div>
  
  <div class="geo-panel" id="geoPanel">
    <div class="geo-panel-header"><h3 class="geo-panel-title">Carregando dados...</h3></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="temas_provedores_bubble.js"></script>
</body>
</html>
